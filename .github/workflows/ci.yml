name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor from pyproject's requires-python, and current stable. The docs
        # corpus shells out to git, so both jobs need it — the runner image has it.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # No git identity step: the docs-corpus tests build real repositories but set
      # user.name/user.email per repo and pass `git init -b master` explicitly, so
      # they pass on a runner with no global git config (verified by running the
      # suite with HOME unset and the global config pointed at /dev/null).
      - run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the checkout
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
