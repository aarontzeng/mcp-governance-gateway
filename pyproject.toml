[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-governance-gateway"
dynamic = ["version"]
description = "A governance and multi-tenancy gateway that fronts backends (agentmemory, issue trackers, a docs corpus, CI) behind the Model Context Protocol, with per-tenant isolation, confirmation-gated writes, and an audit trail."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
# Name without an email, matching how the author's other published projects
# declare it: attribution belongs in the metadata, an address does not.
authors = [{ name = "Aaron Tzeng" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # AES-256-GCM for the per-user credential store (encrypted at rest).
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/aarontzeng/mcp-governance-gateway"
Repository = "https://github.com/aarontzeng/mcp-governance-gateway"
Issues = "https://github.com/aarontzeng/mcp-governance-gateway/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
mcp-governance-gateway = "mcp_governance_gateway.server:main"
mcpgw-admin = "mcp_governance_gateway.admin_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# One place to bump: mcp_governance_gateway/__init__.py (see the comment there).
version = { attr = "mcp_governance_gateway.__version__" }

[tool.pytest.ini_options]
# So a bare `python -m pytest` works from a clone without an editable install.
# Not only convenience: without it pytest collects nothing and reports success,
# which reads exactly like a green suite.
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness and modern-syntax rules only. No line-length rule: the tool
# descriptions and the comments that explain a boundary are prose, and the
# reviewer, not a linter, decides where prose wraps.
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts/changelog-section.py"]
ignore_missing_imports = true
# Every module is checked; the bar is "mypy is clean", not "--strict", because
# the adapters deal in untrusted JSON where `Any` is the honest type.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
